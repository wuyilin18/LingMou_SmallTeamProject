[env:esp32-c6-lingmou]
; 官方 espressif32 平台的 C6 板卡通常只声明 ESP-IDF。
; pioarduino 提供 ESP32-C6 + Arduino framework 所需的平台包。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; LingMou 普通版是 4MB Flash，使用 4MB C6 板卡定义作为构建/烧录基线。
board = esp32-c6-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit AHTX0
    arduino-libraries/NTPClient
    h2zero/NimBLE-Arduino @ ^2.5.1

build_flags =
    -D USER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/tft_setup.h
